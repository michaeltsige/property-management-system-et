# Local development stack.
#
# Postgres is the only hard requirement — the API and the web app run on the host
# so that hot reload works. Two databases are created: `pms_dev` for everyday work
# and `pms_test`, which the test suite truncates between test files.
#
#   docker compose up -d          # start Postgres
#   pnpm db:migrate && pnpm db:seed
#
# Docker is optional: any PostgreSQL 15+ instance works, just point DATABASE_URL
# and TEST_DATABASE_URL at it (see .env.example).

services:
  postgres:
    image: postgres:17-alpine
    container_name: pms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: pms
      POSTGRES_PASSWORD: pms
      POSTGRES_DB: pms_dev
      # `POSTGRES_DB` creates one database; the init script adds the test one.
    # Development tuning: small buffers and relaxed durability so the database is
    # comfortable on a 2 GB machine (Cloud Shell included). The data in this volume
    # is throwaway demo data; `pnpm dev:all` recreates and re-seeds it after a reset.
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - max_connections=50
      - -c
      - fsync=off
      - -c
      - synchronous_commit=off
      - -c
      - full_page_writes=off
    mem_limit: 384m
    ports:
      - '5432:5432'
    volumes:
      - pms-postgres-data:/var/lib/postgresql/data
      - ./docs/ci/init-test-db.sh:/docker-entrypoint-initdb.d/10-test-db.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pms -d pms_dev']
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  pms-postgres-data:
